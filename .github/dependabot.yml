version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/electron"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Electron is pinned to the 38.x line: 45's sandbox aborts on Windows 11.
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]
    groups:
      electron:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
