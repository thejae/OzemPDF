name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
        env:
          PYTHONIOENCODING: utf-8

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install "ruff>=0.6"
      - run: ruff check python/src python/tests

  package:
    name: package metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install build
      - run: python -m build --sdist

  package-linux:
    name: package (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Python package
        run: pip install -e ".[dev]"
      - name: Build frozen engine
        run: python python/scripts/build_cross_platform.py
      - name: Verify frozen engine
        run: artifacts/dist/engine/ozempdf-engine/ozempdf-engine --version
      - name: Install Electron dependencies
        run: npm ci
        working-directory: electron
      - name: Build Linux packages
        run: npx electron-builder --linux --publish never
        working-directory: electron
      - name: Inspect packages
        run: |
          ls -lh release
          file release/*.AppImage release/*.deb
          ./release/*.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/resources/engine/ozempdf-engine/ozempdf-engine
      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            release/*.AppImage
            release/*.deb

  shell:
    name: electron entry points
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --check main.js
      - run: node --check preload.js
