[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ozempdf"
description = "Surgical lossless and visually-lossless PDF slimming with a local web UI"
authors = [{ name = "OzemPDF contributors" }]
maintainers = [{ name = "thejae", email = "738694+thejae@users.noreply.github.com" }]
keywords = ["pdf", "pdf-compression", "compression", "lossless", "image-optimization", "pikepdf", "electron", "offline", "privacy", "document-processing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Office/Business",
  "Topic :: System :: Archiving :: Compression",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
  "pikepdf>=8.0.0",
  "Pillow>=10.0.0",
  "zopfli>=0.2.2",
  "fonttools>=4.40.0",
  "pypdfium2>=4.20.0",
  "pyhanko>=0.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pyinstaller>=6.0", "ruff>=0.6", "numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/thejae/OzemPDF"
Repository = "https://github.com/thejae/OzemPDF"
Issues = "https://github.com/thejae/OzemPDF/issues"
Changelog = "https://github.com/thejae/OzemPDF/blob/main/docs/CHANGELOG.md"
Documentation = "https://github.com/thejae/OzemPDF/blob/main/docs/TECHNICAL_SPECIFICATION.md"

[project.scripts]
ozempdf = "ozempdf.__main__:main"
ozempdf-gui = "ozempdf.gui:launch_gui"

[tool.setuptools.dynamic]
version = { attr = "ozempdf._version.__version__" }

[tool.setuptools.packages.find]
where = ["python/src"]

[tool.setuptools.package-data]
ozempdf = [
  "locales/*.json",
  "web/*.html",
  "web/*.css",
  "web/*.js",
  "web/fonts/*",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python/src"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["python/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
